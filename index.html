<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema Inteligente de Calidad del Aire</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#0f172a;
color:white;
padding:30px;
}

header{
text-align:center;
margin-bottom:30px;
}

header h1{
font-size:2.2rem;
margin-bottom:10px;
}

header p{
color:#94a3b8;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.card h3{
margin-bottom:10px;
}

input{
width:100%;
padding:10px;
border:none;
border-radius:10px;
margin-top:10px;
}

button{
width:100%;
padding:15px;
background:#22c55e;
border:none;
border-radius:10px;
color:white;
font-size:18px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#16a34a;
}

.resultado{
text-align:center;
padding:25px;
background:#1e293b;
border-radius:15px;
margin-top:20px;
}

.estado{
font-size:3rem;
font-weight:bold;
margin-top:10px;
}

.info{
margin-top:15px;
font-size:1.1rem;
}

</style>

</head>

<body>

<header>

<h1>🌎 Sistema Inteligente de Monitoreo de Calidad del Aire</h1>

<p>
Barrancabermeja - Proyecto Introducción a la Ingeniería en IA
</p>

</header>

<div class="dashboard">

<div class="card">

<h3>PM2.5</h3>
<input type="number" id="pm25" placeholder="Ingrese PM2.5">

</div>

<div class="card">

<h3>PM10</h3>
<input type="number" id="pm10" placeholder="Ingrese PM10">

</div>

<div class="card">

<h3>Ozono (O₃)</h3>
<input type="number" id="o3" placeholder="Ingrese O3">

</div>

<div class="card">

<h3>Temperatura (°C)</h3>
<input type="number" id="temp" placeholder="Ingrese temperatura">

</div>

<div class="card">

<h3>Humedad (%)</h3>
<input type="number" id="hum" placeholder="Ingrese humedad">

</div>

</div>

<button onclick="analizar()">

Analizar Calidad del Aire

</button>

<div class="resultado">

<h2>Resultado del Modelo</h2>

<div class="estado" id="estado">

Esperando datos

</div>

<div class="info" id="riesgo"></div>

<div class="info" id="explicacion"></div>

</div>

<script>

function analizar(){

let pm25=parseFloat(document.getElementById("pm25").value)||0;
let pm10=parseFloat(document.getElementById("pm10").value)||0;
let o3=parseFloat(document.getElementById("o3").value)||0;

let estado="";
let riesgo="";
let explicacion="";

if(pm25>60 || pm10>100 || o3>80){

estado="MALA";
riesgo="🔴 Riesgo Alto";

explicacion=
"Los contaminantes superan los niveles recomendados.";

}

else if(pm25>30 || pm10>50 || o3>40){

estado="MODERADA";
riesgo="🟠 Riesgo Medio";

explicacion=
"Se detectan concentraciones moderadas de contaminantes.";

}

else{

estado="BUENA";
riesgo="🟢 Riesgo Bajo";

explicacion=
"Los contaminantes se encuentran dentro de rangos aceptables.";

}

document.getElementById("estado").innerHTML=estado;
document.getElementById("riesgo").innerHTML=riesgo;
document.getElementById("explicacion").innerHTML=explicacion;

}

</script>

</body>

</html>
